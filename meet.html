<!DOCTYPE html>
<html lang="ko" data-music="on">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>다시, 그 결정 앞에서 · 80년의 여정</title>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/meet.css">
</head>
<body class="mt-body">
  <!-- ============================================================
       「다시, 그 결정 앞에서」 — 윤혁님과의 대화, 슬라이드로 진행합니다

       ★ 오전에 교육을 진행한 그 PC · 그 브라우저에서 엽니다.
         진행자 화면이 [회고] 챕터를 열 때 이 PC 에 복사해 둔 것만 읽습니다
         (간담회 자료 review.html 과 같은 저장분입니다). 서버를 부르지 않습니다.
       ★ 화면 전체가 슬라이드입니다. 프레젠터 ▶ 한 번 = 한 장. 마우스는 쓰지 않습니다.
         표지 → 맞았을까, 틀렸을까 → (조 카드 덮인 면 ▶ 뒤집힘) × 조
           → 윤혁님과의 대화 → 우리들이 묻고싶은 이야기 → 앞으로의 DRB → 마무리.
         회고를 남기지 않은 조는 건너뜁니다.
       ★ 화면에는 질문을 띄우지 않습니다. 질문은 「애프터 토크 사회자 대본.md」에만 있습니다.
       ★ 음악은 게임을 시작할 때 나오는 평상시 곡입니다. 표지에서 첫 ▶ 가 음악을 켭니다.
         M 키로 끄고 켭니다.
       ★ 이 파일의 고정 문장(표지 · 맞았을까 · 윤혁님과의 대화 · 묻고싶은 이야기 · 앞으로의 DRB · 마무리)은
         여기서 바로 고칩니다. 조 카드와 '윤혁님과의 대화' 아래 줄은 meet.js 가 저장된 회고로 만듭니다.
       ============================================================ -->

  <!-- 세션 고르기 · 처음으로 · 간담회 자료 — 평소에는 숨어 있고,
       마우스를 화면 맨 위에 댈 때만 내려옵니다. 발표 중에는 보이지 않습니다. -->
  <div class="mt-hot no-print" aria-hidden="true"></div>
  <header class="mt-top no-print" id="mtTop">
    <span class="mt-top__brand">다시, 그 결정 앞에서</span>
    <span class="mt-top__meta" id="mtMeta"></span>
    <span class="spacer"></span>
    <!-- 회고는 세션마다 따로 남습니다 (최근 3개). 세션이 둘 이상일 때만 고르는 칸이 보입니다. -->
    <select class="mt-top__session hidden" id="mtSession" aria-label="교육 세션 고르기"></select>
    <button class="btn btn--sm btn--ghost hidden" id="btnMtDelete">이 세션 지우기</button>
    <button class="btn btn--sm btn--ghost" id="btnMtSound">음악 켜기</button>
    <button class="btn btn--sm btn--ghost" id="btnMtReset">처음으로</button>
    <a class="btn btn--sm btn--ghost" href="review.html" target="_blank" rel="noopener">간담회 자료 ↗</a>
  </header>

  <main class="mt-stage" id="mtStage">

    <!-- 1 표지 -->
    <section class="slide slide--dark" data-slide="title">
      <h1 class="sl-title"><span class="is-accent">다시,</span><br>그 결정 앞에서</h1>
      <!-- 저장된 회고가 없을 때만 한 줄 뜹니다 (meet.js) -->
      <p class="sl-state hidden" id="slState"></p>
    </section>

    <!-- 2 그 결정은 맞았을까, 틀렸을까 — 그때는 모두 물음표였고, 답은 나중에 보입니다 -->
    <section class="slide" data-slide="why">
      <h1 class="sl-h1">그 결정은 맞았을까, 틀렸을까</h1>
      <div class="why">
        <div class="why__labels" aria-hidden="true">
          <span class="why__label why__label--then">그때</span>
          <span class="why__label why__label--now">지금</span>
        </div>

        <article class="why__col">
          <div class="why__top">
            <svg class="why__ic" viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"><circle cx="34" cy="60" r="22"/><circle cx="34" cy="60" r="6"/><circle cx="90" cy="60" r="14"/><circle cx="90" cy="60" r="4"/><line x1="34" y1="38" x2="90" y2="46"/><line x1="34" y1="82" x2="90" y2="74"/></svg>
            <span class="why__year">1947</span>
            <span class="why__word">벨트</span>
          </div>
          <span class="mark mark--q" aria-label="그때: 몰랐다">?</span>
          <svg class="why__arrow" viewBox="0 0 40 84" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="20" y1="14" x2="20" y2="66"/><polyline points="8,54 20,68 32,54"/></svg>
          <span class="mark mark--ok" aria-label="지금: 맞았다"><svg viewBox="0 0 26 26"><polyline points="5,14 11,20 21,7" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        </article>

        <article class="why__col">
          <div class="why__top">
            <svg class="why__ic" viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"><path d="M12 80 V62 L30 58 L44 40 H78 L94 58 L108 62 V80 Z"/><circle cx="36" cy="82" r="10" fill="var(--bg-2)"/><circle cx="86" cy="82" r="10" fill="var(--bg-2)"/><line x1="60" y1="42" x2="60" y2="58"/></svg>
            <span class="why__year">1967</span>
            <span class="why__word">자동차 부품</span>
          </div>
          <span class="mark mark--q" aria-label="그때: 몰랐다">?</span>
          <svg class="why__arrow" viewBox="0 0 40 84" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="20" y1="14" x2="20" y2="66"/><polyline points="8,54 20,68 32,54"/></svg>
          <span class="mark mark--ok" aria-label="지금: 맞았다"><svg viewBox="0 0 26 26"><polyline points="5,14 11,20 21,7" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        </article>

        <article class="why__col">
          <div class="why__top">
            <svg class="why__ic" viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"><path d="M60 98 C22 72 14 46 32 34 C44 26 55 32 60 42 C65 32 76 26 88 34 C106 46 98 72 60 98 Z"/><polyline points="30,62 48,62 55,50 64,74 71,62 90,62"/></svg>
            <span class="why__year">2021</span>
            <span class="why__word">헬스케어</span>
          </div>
          <span class="mark mark--q" aria-label="그때: 몰랐다">?</span>
          <svg class="why__arrow" viewBox="0 0 40 84" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="20" y1="14" x2="20" y2="66"/><polyline points="8,54 20,68 32,54"/></svg>
          <!-- 아직 채점 중 — 점선 -->
          <span class="mark mark--open" aria-label="지금: 아직 모른다">?</span>
        </article>

        <article class="why__col">
          <div class="why__top why__top--now">
            <svg class="why__ic" viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round"><path d="M60 104 C40 78 30 64 30 48 A30 30 0 0 1 90 48 C90 64 80 78 60 104 Z"/><circle cx="60" cy="48" r="11" fill="currentColor"/></svg>
            <span class="why__year">2026</span>
            <span class="why__word">오늘 우리</span>
          </div>
          <span class="mark mark--now" aria-label="그때: 지금 이 순간">?</span>
          <svg class="why__arrow" viewBox="0 0 40 84" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="20" y1="14" x2="20" y2="66"/><polyline points="8,54 20,68 32,54"/></svg>
          <span class="mark mark--now" aria-label="지금: 아무도 모른다">?</span>
        </article>
      </div>
    </section>

    <!-- 조 카드 — meet.js 가 저장된 회고로 여기('윤혁님과의 대화' 앞)에 끼워 넣습니다 -->

    <!-- 윤혁님과의 대화 — 아래 줄은 조들이 회고를 쓴 시대만, 오래된 순으로 (meet.js) -->
    <section class="slide slide--center" data-slide="talk" id="slTalk">
      <h1 class="sl-h1 sl-h1--big">윤혁님과의 대화</h1>
      <div class="eras hidden" id="slEras"></div>
    </section>

    <!-- 우리들이 묻고싶은 이야기 — 질문은 화면에 없습니다 (사회자 대본) -->
    <section class="slide" data-slide="ask">
      <h1 class="sl-h1">우리들이 묻고싶은 이야기</h1>
      <svg class="ask" viewBox="0 0 1640 780" aria-hidden="true">
        <g text-anchor="middle" font-weight="900">
          <polygon points="560,560 500,700 680,580" fill="var(--accent)"/>
          <ellipse cx="700" cy="390" rx="320" ry="220" fill="var(--accent)"/>
          <text x="700" y="470" font-size="240" fill="var(--text-on-accent)">?</text>

          <ellipse cx="1130" cy="450" rx="220" ry="150" fill="var(--accent-tint)" stroke="var(--accent-line)" stroke-width="5"/>
          <path d="M1110,588 L1250,680 L1185,582" fill="var(--accent-tint)" stroke="var(--accent-line)" stroke-width="5" stroke-linejoin="round"/>
          <text x="1130" y="508" font-size="160" fill="var(--accent)">?</text>

          <polygon points="1060,215 1020,290 1110,228" fill="var(--coral)"/>
          <ellipse cx="1130" cy="150" rx="120" ry="88" fill="var(--coral)"/>
          <text x="1130" y="186" font-size="104" fill="var(--text-on-accent)">?</text>
        </g>
      </svg>
    </section>

    <!-- 앞으로의 DRB -->
    <section class="slide slide--center" data-slide="future">
      <h1 class="sl-h1 sl-h1--big">앞으로의 DRB</h1>
    </section>

    <!-- 마무리 -->
    <section class="slide slide--dark slide--center" data-slide="end">
      <h1 class="sl-title sl-title--end">함께해주셔서<br><span class="is-accent">감사합니다.</span></h1>
    </section>
  </main>

  <script src="data/config.js"></script>
  <script src="data/eras.js"></script>
  <script src="data/investments.js"></script>
  <script src="data/policies.js"></script>
  <script src="data/events.js"></script>
  <script src="data/rounds.js"></script>
  <script src="data/global.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/reflectcard.js"></script>
  <script src="js/meet.js"></script>
</body>
</html>
